{% extends 'base.html' %}
{% block content %}
<h1 class="mb-4">Tâches</h1>
<div class="row">
  <div class="col-md-5 mb-4">
    <div class="card">
      <div class="card-header">Nouvelle tâche</div>
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Titre</label>
            <input name="title" class="form-control" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Échéance</label>
            <input type="date" name="due_date" class="form-control" />
          </div>
          <button class="btn btn-primary">Créer</button>
        </form>
      </div>
    </div>
  </div>
  <div class="col-md-7">
    <div class="card">
      <div class="card-header">Suivi des tâches</div>
      <div class="card-body p-0">
        <table class="table mb-0">
          <thead>
            <tr>
              <th>Titre</th>
              <th>Échéance</th>
              <th>Statut</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            {% for task in tasks %}
            <tr class="{% if task.completed %}table-success{% endif %}">
              <td>{{ task.title }}</td>
              <td>{{ task.due_date or '—' }}</td>
              <td>{{ 'Terminée' if task.completed else 'En cours' }}</td>
              <td>
                <form method="post" action="{{ url_for('toggle_task', task_id=task.id) }}">
                  <button class="btn btn-sm {% if task.completed %}btn-secondary{% else %}btn-outline-success{% endif %}">
                    {% if task.completed %}Réouvrir{% else %}Terminer{% endif %}
                  </button>
                </form>
              </td>
            </tr>
            {% else %}
            <tr>
              <td colspan="4" class="text-center text-muted">Aucune tâche définie.</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
